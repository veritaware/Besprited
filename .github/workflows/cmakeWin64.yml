name: Windows x86_64

on:
  push:
    branches: [ trunk ]
    tags:
      - '*'
  pull_request:
    branches: [ trunk ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, 'NO_SW_CHANGE') && !contains(github.event.pull_request.body, 'NO_SW_CHANGE') }}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        release: false
        update: false
        install: >-
          base-devel
          git
          mingw-w64-x86_64-nodejs
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-freetype
          mingw-w64-x86_64-giflib
          mingw-w64-x86_64-libjpeg-turbo
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libwebp
          mingw-w64-x86_64-pixman
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-SDL2_image
          mingw-w64-x86_64-tinyxml2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-libarchive
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
    - name: Check for git tag
      id: check_tag
      shell: bash
      run: |
        TAG=$(git describe --exact-match --tags 2>/dev/null) || true
        if [ -n "$TAG" ]; then
          echo "has_tag=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        else
          echo "has_tag=false" >> $GITHUB_OUTPUT
        fi
    - name: Get short commit hash
      id: commit
      shell: bash
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        echo "short_hash=$SHORT_HASH" >> $GITHUB_OUTPUT
    - name: Update config.h with commit hash
      shell: bash
      run: |
        sed -i 's/#define COMMIT  "local build"/#define COMMIT  "${{ steps.commit.outputs.short_hash }}"/g' src/config.h
    - name: Generate Makefiles
      shell: msys2 {0}
      run: |
        mkdir build
        if [ "${{ steps.check_tag.outputs.has_tag }}" = "true" ]; then
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DRELEASE_TAG=ON ..
        else
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        fi
    - name: Build the binaries
      shell: msys2 {0}
      run: |
        make -C build -j 4
        rm build/bin/gen.exe
        node packaging/package_win.js build/bin/besprited.exe
    - name: Prepare Application bundle
      shell: bash
      run: |
        mkdir -p bundle/bin
        cp -r build/bin/* bundle/bin/
        cp packaging/Launcher.bat bundle/
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.check_tag.outputs.has_tag == 'true' && format('besprited-{0}-windows-x86_64', steps.check_tag.outputs.tag) || 'besprited-windows-x86_64' }}
        path: |
          bundle/**
