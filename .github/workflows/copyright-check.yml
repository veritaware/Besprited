name: Copyright Header Check

on:
  pull_request:

jobs:
  check-copyright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v47
      with:
        files: |
          **/*.h
          **/*.hpp
          **/*.c
          **/*.cpp
          **/*.xml
          **/CMakeLists.txt

    - name: Check copyright header
      if: steps.changed-files.outputs.any_changed == 'true'
      env:
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        YEAR=$(date +%Y)
        PATTERN="[Cc]opyright[[:space:]]+\([Cc]\)[[:space:]]+[0-9]*-?${YEAR}[[:space:]]+Veritaware"
        EXEMPT_FILE=".github/copyright-exempt.txt"
        FAILED=0

        for file in $CHANGED_FILES; do
          if [ ! -f "$file" ]; then
            continue
          fi

          if [ -f "$EXEMPT_FILE" ] && grep -qxF "$file" "$EXEMPT_FILE"; then
            echo "SKIP (exempt): $file"
            continue
          fi

          if head -n 10 "$file" | grep -qE "$PATTERN"; then
            echo "OK: $file"
          else
            echo "MISSING/INVALID copyright header: $file"
            FAILED=1
          fi
        done

        if [ "$FAILED" -ne 0 ]; then
          echo ""
          echo "One or more files are missing a valid copyright header."
          echo "Expected pattern (in the first 10 lines): Copyright (c) [YYYY-]${YEAR} Veritaware"
          exit 1
        fi
