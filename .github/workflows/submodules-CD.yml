name: Deliver submodules too on release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout modules
        run: git submodule update --init --recursive

      - name: Create the ZIP package
        run: |
          git archive -o "Source code + submodues.zip" HEAD
          git submodule --quiet foreach 'cd $toplevel; zip -ru "Source code + submodues.zip" $sm_path'

      - name: Release the artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            "Source code + submodues.zip"
