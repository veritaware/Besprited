name: Feature request
description: Suggest an idea for this project
labels: ["🐞feature"]
projects: ["veritaware/6"]
type: Feature
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Describe the solution you'd like to see implemented. Is your feature request related to an existing problem?
      description: A clear and concise description of what the problem is
      placeholder: e.g., "Add a 'Batch Export Layers' feature that exports all layers at once.\nReasoning: I'm always frustrated when I have to manually export each layer individually."
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here
      placeholder: e.g., "Other sprite editors like X and Y have this feature"
    validations:
      required: false
