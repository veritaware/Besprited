name: Feature request
description: Suggest an idea for this project
labels: ["🐞feature"]
projects: ["veritaware/6"]
type: Feature
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Describe the solution you'd like to see implemented. Add any other context or screenshots about the feature request as needed.
      description: A clear and concise description of what is the functionality you want to request
      placeholder: e.g. "Add a 'Batch Export Layers' feature that exports all layers at once."
    validations:
      required: true
